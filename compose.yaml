services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: turing_app
      POSTGRES_USER: turing_user
      POSTGRES_PASSWORD: turing_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turing_user -d turing_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: turing_minio
      MINIO_ROOT_PASSWORD: turing_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/turing_app
      DB_USERNAME: turing_user
      DB_PASSWORD: turing_pass
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      JWT_SECRET: local-development-only-secret-with-at-least-32-characters
      PROFILE_ENCRYPTION_KEY: bG9jYWwtcHJvZmlsZS1rZXktZXhhY3RseS0zMi1ieXQ=
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_ENABLED: "false"
      MAIL_FROM: no-reply@turing.local
      FRONTEND_BASE_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ${WEB_BUILD_CONTEXT:-../turing-app-web}
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
