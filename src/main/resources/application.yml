spring:
  application:
    name: turing-app-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/turing_app}
    username: ${DB_USERNAME:turing_user}
    password: ${DB_PASSWORD:turing_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
